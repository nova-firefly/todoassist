name: Claude Code

# Runs Claude Code (anthropics/claude-code-action) when kjsb25 mentions @claude in an
# issue, issue comment, or PR review comment. Hermes files these issues on kjsb25's
# behalf, so they arrive as kjsb25.
#
# Auth: Claude Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN (repo or org secret,
# generated with `claude setup-token`). Usage counts against the same plan limits
# as interactive Claude Code. Runs on GitHub-hosted runners.
#
# The actor check below is what stops anyone else from spending the subscription
# (matters on public repos). The action also refuses users without write access.

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'kjsb25' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --append-system-prompt "Follow the repo's CLAUDE.md if present. Never commit secrets, tokens, real .env files, or private hostnames/IPs."
